[package]
name = "fisha"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.12", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"
rfd = "0.14"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
lto = true
debug = false
