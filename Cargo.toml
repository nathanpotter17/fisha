[package]
name = "fisha"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.12", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"
rfd = "0.14"
smol = "2.0.2"

[profile.release]
opt-level = "z"
panic = "abort"
strip = true
lto = true
codegen-units = 1
debug = false

[profile.release.package."*"]
opt-level = "z"
